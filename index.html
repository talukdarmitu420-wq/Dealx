<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DealX - Smart Price Comparison</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#f5f7fb;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  padding:18px 20px;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:26px;
  font-weight:800;
}

.logo span{
  color:#22c55e;
}

.hero{
  max-width:1000px;
  margin:45px auto 25px;
  padding:0 18px;
  text-align:center;
}

.hero h1{
  font-size:38px;
  margin-bottom:12px;
}

.hero p{
  color:#6b7280;
  margin-bottom:25px;
}

.search-box{
  max-width:750px;
  margin:auto;
  display:flex;
  background:white;
  border:1px solid #d1d5db;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.search-box input{
  flex:1;
  border:0;
  outline:0;
  padding:17px;
  font-size:16px;
}

.search-box button{
  border:0;
  background:#22c55e;
  color:white;
  padding:0 25px;
  font-size:20px;
  cursor:pointer;
}

.search-box button:hover{
  background:#16a34a;
}

.container{
  max-width:1100px;
  margin:35px auto;
  padding:0 18px;
}

.status{
  text-align:center;
  margin:20px 0;
  font-weight:600;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:16px;
  padding:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
  display:flex;
  flex-direction:column;
}

.card img{
  width:100%;
  height:210px;
  object-fit:contain;
  border-radius:12px;
  background:#f9fafb;
}

.card h3{
  font-size:16px;
  margin:13px 0 8px;
  line-height:1.4;
}

.store{
  color:#6b7280;
  font-size:13px;
  margin-bottom:8px;
}

.price{
  font-size:21px;
  font-weight:800;
  color:#16a34a;
  margin-bottom:12px;
}

.old-price{
  color:#9ca3af;
  text-decoration:line-through;
  font-size:13px;
  margin-left:7px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:auto;
}

.actions button{
  flex:1;
  padding:11px;
  border:0;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
}

.buy{
  background:#111827;
  color:white;
}

.compare{
  background:#dcfce7;
  color:#166534;
}

.empty{
  text-align:center;
  padding:40px 15px;
  color:#6b7280;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:15px;
  border-radius:10px;
  margin:20px auto;
  max-width:750px;
  line-height:1.5;
}

@media(max-width:600px){
  .hero h1{
    font-size:30px;
  }

  .search-box input{
    min-width:0;
  }

  .search-box button{
    padding:0 18px;
  }

  .products{
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .card{
    padding:10px;
  }

  .card img{
    height:150px;
  }

  .card h3{
    font-size:14px;
  }

  .price{
    font-size:17px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">Deal<span>X</span></div>
    <div>Smart Shopping</div>
  </div>
</header>

<section class="hero">

  <h1>Find the Best Deal</h1>

  <p>
    Search products and compare prices easily.
  </p>

  <div class="search-box">

    <input
      id="searchInput"
      type="text"
      placeholder="Search iPhone, Samsung, laptop..."
      onkeydown="handleSearch(event)"
    >

    <button onclick="searchProduct()">🔍</button>

  </div>

</section>

<div class="container">

  <div id="status" class="status"></div>

  <div id="errorBox"></div>

  <div id="products" class="products"></div>

</div>

<script>

/* =====================================
   DEALX API
===================================== */

const API_URL =
"https://dealx-api.talukdarmitu420.workers.dev/search";


/* =====================================
   SEARCH ON ENTER
===================================== */

function handleSearch(event){

  if(event.key === "Enter"){
    searchProduct();
  }

}


/* =====================================
   GET VALUE FROM OBJECT
===================================== */

function pick(obj, keys){

  for(const key of keys){

    if(
      obj &&
      obj[key] !== undefined &&
      obj[key] !== null &&
      obj[key] !== ""
    ){
      return obj[key];
    }

  }

  return "";

}


/* =====================================
   FIND PRODUCT ARRAY
===================================== */

function getProducts(data){

  if(Array.isArray(data)){
    return data;
  }

  if(!data || typeof data !== "object"){
    return [];
  }

  const possible = [
    data.products,
    data.items,
    data.results,
    data.data,
    data.data?.products,
    data.data?.items,
    data.data?.results
  ];

  for(const item of possible){

    if(Array.isArray(item)){
      return item;
    }

  }

  return [];

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================
   FORMAT PRICE
===================================== */

function formatPrice(value){

  if(value === null || value === undefined || value === ""){
    return "";
  }

  if(typeof value === "number"){
    return "₹" + value.toLocaleString("en-IN");
  }

  return String(value);

}


/* =====================================
   PRODUCT CARD
===================================== */

function productCard(product, index){

  const title = pick(product,[
    "title",
    "name",
    "product_name",
    "productTitle"
  ]) || "Product";

  const price = pick(product,[
    "price",
    "sale_price",
    "selling_price",
    "current_price"
  ]);

  const oldPrice = pick(product,[
    "old_price",
    "mrp",
    "original_price",
    "list_price"
  ]);

  const image = pick(product,[
    "image",
    "image_url",
    "imageUrl",
    "thumbnail",
    "thumbnail_url"
  ]);

  const store = pick(product,[
    "store",
    "seller",
    "merchant",
    "source",
    "retailer"
  ]) || "Online Store";

  const link = pick(product,[
    "url",
    "link",
    "product_url",
    "productUrl"
  ]);

  return `

    <div class="card">

      <img
        src="${escapeHTML(image || "https://via.placeholder.com/400x300?text=DealX")}"
        alt="${escapeHTML(title)}"
        onerror="this.src='https://via.placeholder.com/400x300?text=DealX'"
      >

      <h3>
        ${escapeHTML(title)}
      </h3>

      <div class="store">
        ${escapeHTML(store)}
      </div>

      <div class="price">

        ${escapeHTML(formatPrice(price))}

        ${
          oldPrice
          ? `<span class="old-price">
              ${escapeHTML(formatPrice(oldPrice))}
             </span>`
          : ""
        }

      </div>

      <div class="actions">

        <button
          class="buy"
          onclick="openDeal(${index})"
        >
          Buy
        </button>

        <button
          class="compare"
          onclick="openCompare(${index})"
        >
          Compare
        </button>

      </div>

    </div>

  `;

}


/* =====================================
   GLOBAL SEARCH RESULTS
===================================== */

let currentProducts = [];


/* =====================================
   SEARCH PRODUCT
===================================== */

async function searchProduct(){

  const input =
    document.getElementById("searchInput");

  const status =
    document.getElementById("status");

  const products =
    document.getElementById("products");

  const errorBox =
    document.getElementById("errorBox");

  const query =
    input.value.trim();


  if(!query){

    input.focus();

    return;

  }


  status.innerText =
    "🔎 Searching for " + query + "...";

  products.innerHTML = "";

  errorBox.innerHTML = "";


  try{

    const response = await fetch(API_URL,{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        q:query,

        page:1

      })

    });


    const text =
      await response.text();


    if(!response.ok){

      throw new Error(
        "API returned HTTP " +
        response.status +
        ": " +
        text.slice(0,300)
      );

    }


    let data;

    try{

      data = JSON.parse(text);

    }catch{

      throw new Error(
        "API returned non-JSON response: " +
        text.slice(0,300)
      );

    }


    const list =
      getProducts(data);


    currentProducts = list;


    if(!list.length){

      status.innerText =
        "No products found.";

      products.innerHTML = `

        <div class="empty">

          No products found for
          <strong>${escapeHTML(query)}</strong>.

        </div>

      `;

      return;

    }


    status.innerText =
      list.length + " products found";


    products.innerHTML =
      list.map((item,index)=>
        productCard(item,index)
      ).join("");


  }catch(error){

    console.error(error);

    status.innerText = "";

    errorBox.innerHTML = `

      <div class="error">

        <strong>Could not load products.</strong><br><br>

        ${escapeHTML(error.message)}

        <br><br>

        Please check the DealX API / Worker logs.

      </div>

    `;

  }

}


/* =====================================
   BUY BUTTON
===================================== */

function openDeal(index){

  const product =
    currentProducts[index];

  if(!product){
    return;
  }

  const link =
    pick(product,[
      "url",
      "link",
      "product_url",
      "productUrl"
    ]);

  if(link){

    window.open(link,"_blank");

  }else{

    alert("Product link is not available.");

  }

}


/* =====================================
   COMPARE BUTTON
===================================== */

function openCompare(index){

  const product =
    currentProducts[index];

  if(!product){
    return;
  }

  const title =
    pick(product,[
      "title",
      "name",
      "product_name"
    ]) || "Product";

  const price =
    pick(product,[
      "price",
      "sale_price",
      "selling_price",
      "current_price"
    ]) || "Not available";

  alert(
    "DealX Compare\n\n" +
    title +
    "\n\nPrice: " +
    formatPrice(price)
  );

}

</script>

</body>
</html>
