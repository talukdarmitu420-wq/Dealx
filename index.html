<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>DealX — Compare Prices, Find Better Deals</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --green: #16a34a;
      --red: #dc2626;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    body.dark {
      --bg: #020617;
      --card: #0f172a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.25s, color 0.25s;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(248, 250, 252, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    body.dark header {
      background: rgba(2, 6, 23, 0.88);
    }

    .nav {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 24px;
      letter-spacing: -1px;
      color: var(--text);
      white-space: nowrap;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
      font-size: 20px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    /* HERO */

    .hero {
      padding: 70px 0 45px;
      text-align: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.1);
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(38px, 6vw, 70px);
      line-height: 1;
      letter-spacing: -3px;
      max-width: 850px;
      margin: auto;
      font-weight: 900;
    }

    .gradient-text {
      background: linear-gradient(90deg, #2563eb, #7c3aed, #db2777);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      max-width: 650px;
      margin: 20px auto 30px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    /* SEARCH */

    .search-box {
      width: min(760px, 100%);
      margin: auto;
      padding: 7px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .search-icon {
      padding-left: 14px;
      color: var(--muted);
      font-size: 20px;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 15px 5px;
      font-size: 16px;
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    .search-btn {
      border: 0;
      color: white;
      background: var(--primary);
      padding: 14px 24px;
      border-radius: 13px;
      font-weight: 800;
      transition: 0.2s;
    }

    .search-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .search-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .suggestions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .suggestion {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 13px;
    }

    .suggestion:hover {
      color: var(--primary);
      border-color: var(--primary);
    }

    /* TRUST */

    .trust {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 25px auto 55px;
      max-width: 850px;
    }

    .trust-item {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 17px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 700;
    }

    .trust-icon {
      font-size: 19px;
    }

    /* RESULTS */

    .results-section {
      padding-bottom: 70px;
    }

    .results-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 22px;
    }

    .results-title {
      font-size: 25px;
      font-weight: 850;
    }

    .results-subtitle {
      color: var(--muted);
      margin-top: 5px;
      font-size: 14px;
    }

    .sort-select {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 10px 13px;
      border-radius: 10px;
      outline: none;
    }

    /* PRODUCT GRID */

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product-card {
      position: relative;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(15, 23, 42, 0.04);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .best-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      background: var(--green);
      color: white;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 9px;
      border-radius: 7px;
    }

    .discount-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 9px;
      border-radius: 7px;
    }

    .product-image {
      width: 100%;
      height: 220px;
      padding: 18px;
      display: grid;
      place-items: center;
      background: white;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .product-info {
      padding: 17px;
    }

    .store {
      display: inline-flex;
      padding: 5px 9px;
      border-radius: 7px;
      background: #f1f5f9;
      color: #475569;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    body.dark .store {
      background: #1e293b;
      color: #cbd5e1;
    }

    .product-title {
      font-size: 14px;
      line-height: 1.45;
      font-weight: 700;
      min-height: 61px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 15px 0 5px;
    }

    .price {
      font-size: 22px;
      font-weight: 900;
    }

    .mrp {
      color: var(--muted);
      text-decoration: line-through;
      font-size: 13px;
    }

    .availability {
      color: var(--green);
      font-size: 12px;
      margin-bottom: 14px;
    }

    .deal-btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      color: white;
      background: var(--primary);
      padding: 11px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
    }

    .deal-btn:hover {
      background: var(--primary-dark);
    }

    /* EMPTY / ERROR */

    .message {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 45px 20px;
      text-align: center;
    }

    .message-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .message h3 {
      margin-bottom: 7px;
    }

    .message p {
      color: var(--muted);
      font-size: 14px;
    }

    .error-box {
      border-color: #fecaca;
    }

    body.dark .error-box {
      border-color: #7f1d1d;
    }

    /* LOADING */

    .skeleton {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .skeleton-img {
      height: 220px;
      background: linear-gradient(
        90deg,
        var(--border),
        rgba(148, 163, 184, 0.18),
        var(--border)
      );
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }

    .skeleton-body {
      padding: 17px;
    }

    .skeleton-line {
      height: 12px;
      border-radius: 6px;
      background: var(--border);
      margin-bottom: 10px;
    }

    .skeleton-line.short {
      width: 55%;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    /* FOOTER */

    footer {
      border-top: 1px solid var(--border);
      padding: 28px 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    /* RESPONSIVE */

    @media (max-width: 1000px) {
      .product-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 720px) {
      .hero {
        padding-top: 45px;
      }

      .hero h1 {
        letter-spacing: -2px;
      }

      .search-box {
        border-radius: 15px;
      }

      .search-btn {
        padding: 13px 17px;
      }

      .trust {
        grid-template-columns: 1fr;
      }

      .product-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .product-image {
        height: 175px;
      }

      .product-info {
        padding: 13px;
      }

      .product-title {
        font-size: 13px;
        min-height: 57px;
      }

      .price {
        font-size: 19px;
      }

      .results-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 480px) {
      .container {
        width: min(100% - 20px, 1180px);
      }

      .logo {
        font-size: 21px;
      }

      .logo-icon {
        width: 34px;
        height: 34px;
      }

      .hero {
        padding-top: 35px;
      }

      .hero p {
        font-size: 15px;
      }

      .search-box {
        flex-wrap: wrap;
        padding: 6px;
      }

      .search-icon {
        display: none;
      }

      .search-box input {
        width: 100%;
        flex-basis: 100%;
        padding: 13px;
      }

      .search-btn {
        width: 100%;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }

      .product-image {
        height: 230px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="container nav">

      <div class="logo">
        <div class="logo-icon">⚡</div>
        DealX
      </div>

      <div class="nav-actions">
        <button
          class="icon-btn"
          id="themeBtn"
          title="Toggle dark mode"
          aria-label="Toggle dark mode"
        >
          🌙
        </button>
      </div>

    </div>
  </header>


  <!-- HERO -->
  <main>

    <section class="hero">
      <div class="container">

        <div class="hero-badge">
          ⚡ Smart Price Comparison
        </div>

        <h1>
          Find the
          <span class="gradient-text">Best Deal</span>
          Faster.
        </h1>

        <p>
          Search products and compare prices from Amazon and Flipkart
          in one place.
        </p>


        <!-- SEARCH -->
        <form class="search-box" id="searchForm">

          <span class="search-icon">⌕</span>

          <input
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="Search for iPhone, laptop, headphones..."
          />

          <button class="search-btn" id="searchBtn" type="submit">
            Search
          </button>

        </form>


        <!-- QUICK SEARCH -->
        <div class="suggestions">
          <button class="suggestion" data-query="iPhone 15">iPhone 15</button>
          <button class="suggestion" data-query="Samsung Galaxy S24">Samsung Galaxy S24</button>
          <button class="suggestion" data-query="Sony headphones">Sony Headphones</button>
          <button class="suggestion" data-query="HP laptop">HP Laptop</button>
        </div>

      </div>
    </section>


    <!-- TRUST -->
    <section class="container">

      <div class="trust">

        <div class="trust-item">
          <span class="trust-icon">🔎</span>
          Real Product Search
        </div>

        <div class="trust-item">
          <span class="trust-icon">⚡</span>
          Fast Comparison
        </div>

        <div class="trust-item">
          <span class="trust-icon">🔒</span>
          Secure Redirects
        </div>

      </div>

    </section>


    <!-- RESULTS -->
    <section class="container results-section">

      <div id="results"></div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer>
    <div class="container">
      © 2026 DealX · Compare smarter, buy better.
    </div>
  </footer>


  <script>

    /*
     ============================================================
     DEALX API CONFIGURATION
     ============================================================

     IMPORTANT:
     Replace the URL below with your Cloudflare Worker URL.

     Example:

     const API_BASE_URL =
       "https://dealx-api.yourname.workers.dev";

     DO NOT put Amazon secret keys or Flipkart secret keys here.
     Those must stay inside Cloudflare Worker environment secrets.
     ============================================================
    */

    const API_BASE_URL = "PASTE_YOUR_CLOUDFLARE_WORKER_URL_HERE";


    // ------------------------------------------------------------
    // ELEMENTS
    // ------------------------------------------------------------

    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const results = document.getElementById("results");
    const themeBtn = document.getElementById("themeBtn");


    // ------------------------------------------------------------
    // DARK MODE
    // ------------------------------------------------------------

    const savedTheme = localStorage.getItem("dealx-theme");

    if (savedTheme === "dark") {
      document.body.classList.add("dark");
      themeBtn.textContent = "☀️";
    }

    themeBtn.addEventListener("click", () => {

      document.body.classList.toggle("dark");

      const isDark = document.body.classList.contains("dark");

      localStorage.setItem(
        "dealx-theme",
        isDark ? "dark" : "light"
      );

      themeBtn.textContent = isDark ? "☀️" : "🌙";
    });


    // ------------------------------------------------------------
    // QUICK SEARCH BUTTONS
    // ------------------------------------------------------------

    document.querySelectorAll(".suggestion").forEach(button => {

      button.addEventListener("click", () => {

        const query = button.dataset.query;

        searchInput.value = query;

        performSearch(query);

      });

    });


    // ------------------------------------------------------------
    // FORM SUBMIT
    // ------------------------------------------------------------

    searchForm.addEventListener("submit", event => {

      event.preventDefault();

      const query = searchInput.value.trim();

      if (!query) {

        searchInput.focus();

        return;

      }

      performSearch(query);

    });


    // ------------------------------------------------------------
    // LOADING UI
    // ------------------------------------------------------------

    function showLoading() {

      results.innerHTML = `

        <div class="results-header">

          <div>
            <div class="results-title">
              Searching...
            </div>

            <div class="results-subtitle">
              Checking available stores
            </div>
          </div>

        </div>

        <div class="product-grid">

          ${Array.from({ length: 8 }).map(() => `

            <div class="skeleton">

              <div class="skeleton-img"></div>

              <div class="skeleton-body">

                <div class="skeleton-line short"></div>

                <div class="skeleton-line"></div>

                <div class="skeleton-line"></div>

                <div class="skeleton-line short"></div>

              </div>

            </div>

          `).join("")}

        </div>

      `;

    }


    // ------------------------------------------------------------
    // ERROR UI
    // ------------------------------------------------------------

    function showError(message) {

      results.innerHTML = `

        <div class="message error-box">

          <div class="message-icon">
            ⚠️
          </div>

          <h3>
            Something went wrong
          </h3>

          <p>
            ${escapeHtml(message)}
          </p>

        </div>

      `;

    }


    // ------------------------------------------------------------
    // EMPTY UI
    // ------------------------------------------------------------

    function showEmpty(query) {

      results.innerHTML = `

        <div class="message">

          <div class="message-icon">
            🔍
          </div>

          <h3>
            No products found
          </h3>

          <p>
            We couldn't find products for
            "<strong>${escapeHtml(query)}</strong>".
            Try another search.
          </p>

        </div>

      `;

    }


    // ------------------------------------------------------------
    // MAIN SEARCH
    // ------------------------------------------------------------

    async function performSearch(query) {

      if (
        !API_BASE_URL ||
        API_BASE_URL === "PASTE_YOUR_CLOUDFLARE_WORKER_URL_HERE"
      ) {

        showError(
          "Please add your Cloudflare Worker URL inside API_BASE_URL in index.html."
        );

        return;

      }


      showLoading();

      searchBtn.disabled = true;
      searchBtn.textContent = "Searching...";


      try {

        const url =
          API_BASE_URL.replace(/\/+$/, "") +
          "/search?q=" +
          encodeURIComponent(query);


        const response = await fetch(url, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });


        let data;

        try {

          data = await response.json();

        } catch {

          throw new Error(
            "The API returned an invalid response."
          );

        }


        if (!response.ok) {

          throw new Error(
            data?.error ||
            "Product search service is unavailable."
          );

        }


        if (!data.success) {

          throw new Error(
            data.error ||
            "Search failed."
          );

        }


        const products = Array.isArray(data.products)
          ? data.products
          : [];


        if (products.length === 0) {

          showEmpty(query);

          return;

        }


        renderProducts(
          query,
          products,
          data.stores || {}
        );


      } catch (error) {

        console.error("DealX Search Error:", error);

        showError(
          error?.message ||
          "Unable to connect to DealX API."
        );

      } finally {

        searchBtn.disabled = false;
        searchBtn.textContent = "Search";

      }

    }


    // ------------------------------------------------------------
    // RENDER PRODUCTS
    // ------------------------------------------------------------

    function renderProducts(query, products, stores) {

      const sortedProducts = [...products].sort(
        (a, b) => Number(a.price) - Number(b.price)
      );


      const cheapestPrice =
        Number(sortedProducts[0]?.price || 0);


      results.innerHTML = `

        <div class="results-header">

          <div>

            <div class="results-title">
              Deals for "${escapeHtml(query)}"
            </div>

            <div class="results-subtitle">

              ${sortedProducts.length}
              products found

              ·

              ${getStoreSummary(stores)}

            </div>

          </div>


          <select class="sort-select" id="sortSelect">

            <option value="low">
              Price: Low to High
            </option>

            <option value="high">
              Price: High to Low
            </option>

            <option value="discount">
              Highest Discount
            </option>

          </select>

        </div>


        <div
          class="product-grid"
          id="productGrid"
        ></div>

      `;


      renderProductGrid(
        sortedProducts,
        cheapestPrice
      );


      const sortSelect =
        document.getElementById("sortSelect");


      sortSelect.addEventListener("change", () => {

        let sorted = [...products];


        if (sortSelect.value === "low") {

          sorted.sort(
            (a, b) => Number(a.price) - Number(b.price)
          );

        }


        if (sortSelect.value === "high") {

          sorted.sort(
            (a, b) => Number(b.price) - Number(a.price)
          );

        }


        if (sortSelect.value === "discount") {

          sorted.sort(
            (a, b) =>
              discountNumber(b.discount) -
              discountNumber(a.discount)
          );

        }


        renderProductGrid(
          sorted,
          cheapestPrice
        );

      });

    }


    // ------------------------------------------------------------
    // PRODUCT GRID
    // ------------------------------------------------------------

    function renderProductGrid(products, cheapestPrice) {

      const grid =
        document.getElementById("productGrid");


      if (!grid) return;


      grid.innerHTML = products.map(product => {

        const price =
          Number(product.price || 0);

        const mrp =
          Number(product.mrp || 0);


        const isBest =
          price === cheapestPrice;


        const discount =
          product.discount ||
          calculateDiscount(price, mrp);


        return `

          <article class="product-card">

            ${
              isBest
                ? `<div class="best-badge">BEST PRICE</div>`
                : ""
            }


            ${
              discount
                ? `<div class="discount-badge">
                    ${escapeHtml(String(discount))} OFF
                   </div>`
                : ""
            }


            <div class="product-image">

              <img
                src="${safeUrl(product.image)}"
                alt="${escapeHtml(product.title || "Product")}"
                loading="lazy"
                onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22400%22%3E%3Crect width=%22400%22 height=%22400%22 fill=%22%23f1f5f9%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23647569%22 font-size=%2220%22%3ENo Image%3C/text%3E%3C/svg%3E'"
              />

            </div>


            <div class="product-info">

              <div class="store">
                ${escapeHtml(product.store || "Store")}
              </div>


              <div class="product-title">
                ${escapeHtml(product.title || "Product")}
              </div>


              <div class="price-row">

                <span class="price">
                  ₹${formatPrice(price)}
                </span>

                ${
                  mrp > price
                    ? `<span class="mrp">
                        ₹${formatPrice(mrp)}
                       </span>`
                    : ""
                }

              </div>


              <div class="availability">

                ${
                  product.availability
                    ? "● " + escapeHtml(product.availability)
                    : "● Check availability"
                }

              </div>


              <a
                class="deal-btn"
                href="${safeUrl(product.url)}"
                target="_blank"
                rel="noopener noreferrer nofollow"
              >
                View Deal →
              </a>

            </div>

          </article>

        `;

      }).join("");

    }


    // ------------------------------------------------------------
    // HELPERS
    // ------------------------------------------------------------

    function formatPrice(value) {

      const number = Number(value || 0);

      return number.toLocaleString("en-IN", {
        maximumFractionDigits: 0
      });

    }


    function discountNumber(discount) {

      if (!discount) return 0;

      const number =
        parseFloat(
          String(discount).replace("%", "")
        );

      return isNaN(number) ? 0 : number;

    }


    function calculateDiscount(price, mrp) {

      if (
        !mrp ||
        !price ||
        mrp <= price
      ) {

        return null;

      }


      return Math.round(
        ((mrp - price) / mrp) * 100
      ) + "%";

    }


    function getStoreSummary(stores) {

      const activeStores = [];

      if (
        stores.amazon === "success"
      ) {

        activeStores.push("Amazon");

      }

      if (
        stores.flipkart === "success"
      ) {

        activeStores.push("Flipkart");

      }


      if (activeStores.length === 0) {

        return "Store data available";

      }


      return activeStores.join(" + ");

    }


    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function safeUrl(value) {

      if (!value) {

        return "#";

      }


      try {

        const url =
          new URL(value);

        if (
          url.protocol === "http:" ||
          url.protocol === "https:"
        ) {

          return escapeHtml(
            url.href
          );

        }

      } catch {}

      return "#";

    }


    // ------------------------------------------------------------
    // ENTER KEY FRIENDLY
    // ------------------------------------------------------------

    searchInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          searchForm.requestSubmit();

        }

      }
    );

  </script>

</body>
</html>
