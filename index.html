<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>DealX — Smart Price Comparison</title>

  <meta
    name="description"
    content="DealX compares product prices across online stores and helps you find the best deal."
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #111827;
      --accent: #2563eb;
      --accent2: #7c3aed;
      --green: #059669;
      --red: #dc2626;
      --shadow: 0 15px 45px rgba(15, 23, 42, 0.08);
    }

    body.dark {
      --bg: #080b12;
      --card: #111621;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1f2937;
      --primary: #f8fafc;
      --shadow: 0 20px 55px rgba(0, 0, 0, 0.35);
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(37, 99, 235, 0.09),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 15%,
          rgba(124, 58, 237, 0.08),
          transparent 25%
        ),
        var(--bg);

      color: var(--text);
      min-height: 100vh;
      transition: 0.25s ease;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
    }

    /* NAVBAR */

    header {
      position: sticky;
      top: 0;
      z-index: 50;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      background: rgba(255, 255, 255, 0.78);
      border-bottom: 1px solid var(--border);
    }

    body.dark header {
      background: rgba(8, 11, 18, 0.82);
    }

    .nav {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 900;
      font-size: 24px;
      letter-spacing: -1px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #7c3aed
        );

      color: white;
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.28);
    }

    .brand-mark span {
      font-size: 20px;
      font-weight: 900;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .api-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
    }

    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.7);
    }

    .status-dot.offline {
      background: #ef4444;
    }

    .theme-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 18px;
    }

    /* HERO */

    .hero {
      padding: 70px 0 35px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 8px 13px;
      border-radius: 999px;

      background: rgba(37, 99, 235, 0.09);
      color: var(--accent);

      font-size: 13px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 76px);
      line-height: 0.98;
      letter-spacing: -4px;
      max-width: 850px;
      margin: auto;
    }

    .gradient-text {
      background:
        linear-gradient(
          90deg,
          #2563eb,
          #7c3aed,
          #db2777
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      max-width: 680px;
      margin: 22px auto 30px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 16px;
    }

    /* SEARCH */

    .search-wrap {
      max-width: 820px;
      margin: auto;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 8px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;

      box-shadow: var(--shadow);
    }

    .search-icon {
      padding-left: 14px;
      color: var(--muted);
      font-size: 20px;
    }

    .search-box input {
      flex: 1;
      min-width: 0;

      border: 0;
      outline: 0;

      background: transparent;
      color: var(--text);

      padding: 14px 4px;
      font-size: 16px;
    }

    .search-box button {
      border: 0;
      border-radius: 13px;

      padding: 14px 23px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #4f46e5
        );

      color: white;
      font-weight: 800;

      box-shadow:
        0 8px 20px rgba(37, 99, 235, 0.25);

      transition: 0.2s ease;
    }

    .search-box button:hover {
      transform: translateY(-1px);
    }

    .search-box button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .quick-searches {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
    }

    .quick {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);

      padding: 8px 12px;
      border-radius: 999px;

      font-size: 12px;
      transition: 0.2s;
    }

    .quick:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* FEATURES */

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 28px 0 45px;
    }

    .feature {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;

      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.04);
    }

    .feature-icon {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .feature strong {
      display: block;
      margin-bottom: 5px;
    }

    .feature span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* STATUS */

    .message {
      display: none;
      margin: 25px 0;
      padding: 15px 18px;

      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card);

      font-size: 14px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      border-color: rgba(220, 38, 38, 0.35);
      color: #ef4444;
    }

    .message.success {
      border-color: rgba(5, 150, 105, 0.35);
      color: var(--green);
    }

    /* RESULTS */

    .results-section {
      padding-bottom: 70px;
    }

    .results-head {
      display: none;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .results-head.show {
      display: flex;
    }

    .results-head h2 {
      font-size: 26px;
      letter-spacing: -1px;
    }

    .results-count {
      color: var(--muted);
      font-size: 13px;
    }

    .products {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fill,
          minmax(220px, 1fr)
        );

      gap: 18px;
    }

    .product {
      position: relative;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;

      overflow: hidden;

      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.05);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .product:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .best-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;

      background: #059669;
      color: white;

      padding: 6px 9px;
      border-radius: 999px;

      font-size: 11px;
      font-weight: 900;
    }

    .product-image {
      height: 215px;
      padding: 18px;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          145deg,
          rgba(148, 163, 184, 0.08),
          rgba(148, 163, 184, 0.02)
        );
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .product-body {
      padding: 17px;
    }

    .store {
      color: var(--accent);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .product-title {
      font-size: 14px;
      font-weight: 700;

      line-height: 1.45;

      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;

      min-height: 61px;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 13px;
    }

    .price {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .mrp {
      font-size: 12px;
      color: var(--muted);
      text-decoration: line-through;
    }

    .discount {
      display: inline-block;
      margin-top: 7px;

      color: var(--green);
      font-size: 12px;
      font-weight: 800;
    }

    .buy-btn {
      display: block;
      width: 100%;

      margin-top: 15px;
      padding: 12px;

      border-radius: 12px;

      text-align: center;

      background: var(--primary);
      color: var(--bg);

      font-size: 13px;
      font-weight: 900;

      transition: 0.2s;
    }

    .buy-btn:hover {
      opacity: 0.86;
    }

    /* EMPTY */

    .empty {
      display: none;
      text-align: center;
      padding: 55px 20px;
      color: var(--muted);
    }

    .empty.show {
      display: block;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .empty h3 {
      color: var(--text);
      margin-bottom: 8px;
    }

    /* LOADING */

    .loading {
      display: none;
      grid-template-columns:
        repeat(
          auto-fill,
          minmax(220px, 1fr)
        );
      gap: 18px;
    }

    .loading.show {
      display: grid;
    }

    .skeleton {
      height: 390px;
      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          var(--card) 25%,
          rgba(148, 163, 184, 0.15) 50%,
          var(--card) 75%
        );

      background-size: 200% 100%;
      animation: skeleton 1.3s infinite;
      border: 1px solid var(--border);
    }

    @keyframes skeleton {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* COMPARISON */

    .comparison {
      display: none;
      margin-top: 45px;
    }

    .comparison.show {
      display: block;
    }

    .comparison h2 {
      margin-bottom: 15px;
      font-size: 24px;
    }

    .table-wrap {
      overflow-x: auto;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      padding: 15px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 13px;
    }

    th {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }

    td strong {
      font-size: 16px;
    }

    .lowest {
      color: var(--green);
      font-weight: 900;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid var(--border);
      padding: 30px 0;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .container {
        width: min(100% - 22px, 1180px);
      }

      .nav {
        height: 64px;
      }

      .brand {
        font-size: 21px;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
      }

      .api-status {
        display: none;
      }

      .hero {
        padding: 45px 0 25px;
      }

      .hero h1 {
        font-size: 46px;
        letter-spacing: -2.5px;
      }

      .hero p {
        font-size: 14px;
      }

      .search-box {
        border-radius: 15px;
      }

      .search-icon {
        display: none;
      }

      .search-box input {
        padding-left: 10px;
      }

      .search-box button {
        padding: 12px 15px;
      }

      .features {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .feature {
        padding: 15px;
      }

      .products {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
        gap: 10px;
      }

      .product {
        border-radius: 15px;
      }

      .product-image {
        height: 150px;
        padding: 12px;
      }

      .product-body {
        padding: 12px;
      }

      .product-title {
        font-size: 12px;
        min-height: 52px;
      }

      .price {
        font-size: 19px;
      }

      .mrp {
        font-size: 10px;
      }

      .buy-btn {
        font-size: 11px;
        padding: 10px;
      }

      .best-badge {
        font-size: 9px;
        padding: 5px 7px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->

  <header>
    <div class="container nav">

      <div class="brand">
        <div class="brand-mark">
          <span>×</
